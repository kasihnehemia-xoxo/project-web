<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading and List</title>
</head>
<body>
    <h1>My Favourite Colors</h1>
    <ol>
        <li>Blue</li>
        <li>Teal</li>
        <li>Red</li>
    </ol>
    <h1>My Favourite Colors 2</h1>
    <ul>
        <li>Blue</li>
        <li>Teal</li>
        <li>Red</li>
    </ul>
    <h1>Sample Description List</h1>
    <dl>
        <dt>FTP</dt>
        <dd>lorem ipsum dolor sit amet</dd>
        <dt>HTTP</dt>
        <dd>HyperText Transfer Protocol</dd>
    </dl>
</body>
</html>
